<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="2360" viewBox="0 0 1240 1180" font-family="DejaVu Sans, Verdana, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0e7490"/>
    </marker>
    <style>
      .title  { font-size: 30px; font-weight: bold; fill: #0e7490; }
      .subtitle { font-size: 15px; fill: #475569; }
      .cardTitle { font-size: 17px; font-weight: bold; }
      .cardLine  { font-size: 13px; fill: #334155; }
      .cardTag   { font-size: 11.5px; fill: #64748b; }
      .appTitle  { font-size: 20px; font-weight: bold; fill: #ffffff; }
      .appLine   { font-size: 13.5px; fill: #e0f2fe; }
      .chip      { font-size: 12.5px; font-weight: bold; fill: #0e7490; }
      .arrowLbl  { font-size: 12px; fill: #0f172a; font-weight: bold; }
      .arrowLblBg{ fill: #ffffff; }
      .sectionLbl{ font-size: 14px; font-weight: bold; fill: #0e7490; letter-spacing: 1px; }
      .flowTitle { font-size: 13px; font-weight: bold; fill: #0f172a; }
      .flowLine  { font-size: 11.5px; fill: #334155; }
      .flowNum   { font-size: 13px; font-weight: bold; fill: #ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="1180" fill="#f8fafc"/>

  <!-- Título -->
  <text x="620" y="44" text-anchor="middle" class="title">Casa da Crianca - Arquitetura e Fluxo do App de Estoque</text>
  <text x="620" y="68" text-anchor="middle" class="subtitle">Controle de doacoes - ONG de Itapira/SP - App mobile com inteligencia invisivel ao usuario</text>

  <!-- Banda do usuário/dispositivo -->
  <rect x="370" y="92" width="500" height="58" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="620" y="118" text-anchor="middle" class="cardTitle" fill="#0e7490">Usuaria voluntaria  -  Dispositivo</text>
  <text x="620" y="138" text-anchor="middle" class="cardTag">Android  -  iOS  -  Navegador Web   (mesmo codigo via React Native + Expo)</text>
  <line x1="620" y1="150" x2="620" y2="196" stroke="#0e7490" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Caixa central do APP -->
  <rect x="400" y="200" width="440" height="250" rx="16" fill="#0e7490"/>
  <text x="620" y="232" text-anchor="middle" class="appTitle">APLICATIVO (camada cliente)</text>
  <text x="620" y="256" text-anchor="middle" class="appLine">React Native 0.81  -  Expo SDK 54</text>
  <text x="620" y="276" text-anchor="middle" class="appLine">Expo Router 6 (rotas por arquivo)  -  TypeScript 5.9</text>

  <!-- chips internos -->
  <rect x="426" y="296" width="180" height="34" rx="8" fill="#ffffff"/>
  <text x="516" y="318" text-anchor="middle" class="chip">app/  (telas e rotas)</text>
  <rect x="634" y="296" width="180" height="34" rx="8" fill="#ffffff"/>
  <text x="724" y="318" text-anchor="middle" class="chip">components/  (UI)</text>
  <rect x="426" y="338" width="180" height="34" rx="8" fill="#ffffff"/>
  <text x="516" y="360" text-anchor="middle" class="chip">services/  (integracoes)</text>
  <rect x="634" y="338" width="180" height="34" rx="8" fill="#ffffff"/>
  <text x="724" y="360" text-anchor="middle" class="chip">contexts/ + theme/</text>
  <rect x="426" y="380" width="388" height="48" rx="8" fill="#155e75"/>
  <text x="620" y="400" text-anchor="middle" class="appLine">Persistencia local: AsyncStorage (config de notificacoes)</text>
  <text x="620" y="418" text-anchor="middle" class="appLine">Conexao: @react-native-community/netinfo (barra offline)</text>

  <!-- ===================== CARDS ESQUERDA ===================== -->
  <!-- L1 Autenticação -->
  <rect x="40" y="210" width="320" height="118" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="40" y="210" width="320" height="26" rx="12" fill="#f59e0b"/>
  <text x="52" y="228" class="cardTitle" fill="#ffffff">Autenticacao</text>
  <text x="270" y="228" class="cardTag" fill="#fff7ed">Nuvem - Google</text>
  <text x="52" y="256" class="cardLine">Google Sign-In (build nativo)</text>
  <text x="52" y="276" class="cardLine">Firebase Authentication</text>
  <text x="52" y="296" class="cardTag">e-mail/senha - reset - visitante anonimo</text>
  <text x="52" y="316" class="cardTag">authService.ts - AuthContext - sessao via token JWT</text>

  <!-- L2 Firestore -->
  <rect x="40" y="400" width="320" height="118" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <rect x="40" y="400" width="320" height="26" rx="12" fill="#ea580c"/>
  <text x="52" y="418" class="cardTitle" fill="#ffffff">Cloud Firestore</text>
  <text x="262" y="418" class="cardTag" fill="#fff7ed">Nuvem - Firebase</text>
  <text x="52" y="446" class="cardLine">Banco NoSQL em tempo real</text>
  <text x="52" y="466" class="cardTag">colecoes: produtos, lotes, movimentacoes, categorias</text>
  <text x="52" y="486" class="cardTag">onSnapshot (listeners) atualizam a tela na hora</text>
  <text x="52" y="506" class="cardTag">modo offline: fila local + sincroniza ao reconectar</text>

  <!-- L3 Cloudinary -->
  <rect x="40" y="590" width="320" height="118" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="40" y="590" width="320" height="26" rx="12" fill="#3b82f6"/>
  <text x="52" y="608" class="cardTitle" fill="#ffffff">Cloudinary</text>
  <text x="250" y="608" class="cardTag" fill="#eff6ff">Nuvem - Midia</text>
  <text x="52" y="636" class="cardLine">Hospedagem das fotos dos produtos</text>
  <text x="52" y="656" class="cardTag">upload via expo-file-system (preset unsigned)</text>
  <text x="52" y="676" class="cardTag">retorna secure_url salva no campo fotoUrl</text>
  <text x="52" y="696" class="cardTag">storageService.ts</text>

  <!-- ===================== CARDS DIREITA ===================== -->
  <!-- R1 ML -->
  <rect x="880" y="210" width="320" height="118" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="880" y="210" width="320" height="26" rx="12" fill="#7c3aed"/>
  <text x="892" y="228" class="cardTitle" fill="#ffffff">API de Machine Learning</text>
  <text x="1095" y="228" class="cardTag" fill="#f5f3ff">Hugging Face</text>
  <text x="892" y="256" class="cardLine">FastAPI (Python) + scikit-learn</text>
  <text x="892" y="276" class="cardTag">POST /classificar       (Arvore de Decisao)</text>
  <text x="892" y="296" class="cardTag">POST /agrupar-doacoes   (K-Means)</text>
  <text x="892" y="316" class="cardTag">POST /prever-fim-estoque (Regressao Linear)</text>

  <!-- R2 Catálogo de produtos -->
  <rect x="880" y="400" width="320" height="118" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="880" y="400" width="320" height="26" rx="12" fill="#16a34a"/>
  <text x="892" y="418" class="cardTitle" fill="#ffffff">Catalogo de Produtos (EAN)</text>
  <text x="1110" y="418" class="cardTag" fill="#f0fdf4">APIs</text>
  <text x="892" y="446" class="cardLine">1) Cosmos API (produtos do Brasil)</text>
  <text x="892" y="466" class="cardLine">2) Open Food Facts (fallback global)</text>
  <text x="892" y="486" class="cardTag">cache no Firestore -&gt; Cosmos -&gt; Open Food Facts</text>
  <text x="892" y="506" class="cardTag">preenche nome, foto, categoria, conteudo - barcode.ts</text>

  <!-- R3 APIs nativas -->
  <rect x="880" y="590" width="320" height="118" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <rect x="880" y="590" width="320" height="26" rx="12" fill="#0891b2"/>
  <text x="892" y="608" class="cardTitle" fill="#ffffff">APIs nativas do dispositivo</text>
  <text x="1120" y="608" class="cardTag" fill="#ecfeff">Expo</text>
  <text x="892" y="636" class="cardLine">expo-camera: leitura de codigo de barras</text>
  <text x="892" y="656" class="cardLine">expo-notifications: alertas locais</text>
  <text x="892" y="676" class="cardLine">expo-print + expo-sharing: relatorio PDF</text>
  <text x="892" y="696" class="cardTag">expo-image-picker: foto da galeria/camera</text>

  <!-- ===================== SETAS ESQUERDA ===================== -->
  <path d="M400,268 L362,268" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="368" y="246" width="30" height="16" class="arrowLblBg"/>
  <path d="M400,330 C385,330 375,420 362,452" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M400,360 C384,400 374,600 362,636" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="372" y="258" width="24" height="16" rx="3" fill="#fef3c7"/>
  <text x="384" y="270" text-anchor="middle" class="arrowLbl">login</text>
  <rect x="372" y="452" width="26" height="16" rx="3" fill="#ffedd5"/>
  <text x="385" y="464" text-anchor="middle" class="arrowLbl">dados</text>
  <rect x="372" y="636" width="26" height="16" rx="3" fill="#dbeafe"/>
  <text x="385" y="648" text-anchor="middle" class="arrowLbl">fotos</text>

  <!-- ===================== SETAS DIREITA ===================== -->
  <path d="M840,268 L878,268" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M840,330 C856,330 866,420 878,452" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M840,360 C857,400 867,600 878,636" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="842" y="258" width="34" height="16" rx="3" fill="#ede9fe"/>
  <text x="859" y="270" text-anchor="middle" class="arrowLbl">HTTP</text>
  <rect x="842" y="452" width="26" height="16" rx="3" fill="#dcfce7"/>
  <text x="855" y="464" text-anchor="middle" class="arrowLbl">EAN</text>
  <rect x="842" y="636" width="30" height="16" rx="3" fill="#cffafe"/>
  <text x="857" y="648" text-anchor="middle" class="arrowLbl">SDK</text>

  <!-- ===================== FLUXO ===================== -->
  <line x1="40" y1="760" x2="1200" y2="760" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="788" class="sectionLbl">FLUXO PRINCIPAL  -  REGISTRAR ENTRADA DE DOACAO E CLASSIFICAR O RISCO</text>

  <!-- passos do fluxo -->
  <!-- passo 1 -->
  <rect x="40" y="808" width="210" height="120" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="1.8"/>
  <circle cx="64" cy="832" r="12" fill="#0891b2"/>
  <text x="64" y="837" text-anchor="middle" class="flowNum">1</text>
  <text x="84" y="837" class="flowTitle">Escanear codigo</text>
  <text x="54" y="862" class="flowLine">expo-camera le o EAN</text>
  <text x="54" y="882" class="flowLine">do produto doado</text>
  <text x="54" y="908" class="cardTag">tela: app/entrada</text>

  <!-- passo 2 -->
  <rect x="280" y="808" width="210" height="120" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <circle cx="304" cy="832" r="12" fill="#16a34a"/>
  <text x="304" y="837" text-anchor="middle" class="flowNum">2</text>
  <text x="324" y="837" class="flowTitle">Buscar dados</text>
  <text x="294" y="862" class="flowLine">cache -&gt; Cosmos -&gt;</text>
  <text x="294" y="882" class="flowLine">Open Food Facts</text>
  <text x="294" y="908" class="cardTag">preenche o formulario</text>

  <!-- passo 3 -->
  <rect x="520" y="808" width="210" height="120" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <circle cx="544" cy="832" r="12" fill="#ea580c"/>
  <text x="544" y="837" text-anchor="middle" class="flowNum">3</text>
  <text x="564" y="837" class="flowTitle">Salvar lote</text>
  <text x="534" y="862" class="flowLine">grava produto + lote</text>
  <text x="534" y="882" class="flowLine">no Cloud Firestore</text>
  <text x="534" y="908" class="cardTag">foto vai p/ Cloudinary</text>

  <!-- passo 4 -->
  <rect x="760" y="808" width="210" height="120" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <circle cx="784" cy="832" r="12" fill="#7c3aed"/>
  <text x="784" y="837" text-anchor="middle" class="flowNum">4</text>
  <text x="804" y="837" class="flowTitle">Classificar risco</text>
  <text x="774" y="862" class="flowLine">POST /classificar</text>
  <text x="774" y="882" class="flowLine">Arvore de Decisao (IA)</text>
  <text x="774" y="908" class="cardTag">retorna nivel de risco</text>

  <!-- passo 5 -->
  <rect x="1000" y="808" width="200" height="120" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="1024" cy="832" r="12" fill="#dc2626"/>
  <text x="1024" y="837" text-anchor="middle" class="flowNum">5</text>
  <text x="1044" y="837" class="flowTitle">Alertar</text>
  <text x="1014" y="862" class="flowLine">badge colorido no</text>
  <text x="1014" y="882" class="flowLine">estoque + tela inicial</text>
  <text x="1014" y="908" class="cardTag">e lista de necessidades</text>

  <!-- setas do fluxo -->
  <path d="M250,868 L278,868" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M490,868 L518,868" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M730,868 L758,868" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M970,868 L998,868" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Rodapé / legenda offline -->
  <rect x="40" y="956" width="1160" height="60" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="1.3"/>
  <text x="60" y="982" class="cardTitle" fill="#0e7490">Resiliencia offline</text>
  <text x="60" y="1004" class="cardLine">Sem internet: o lote e salvo com risco nulo no Firestore local. Ao reconectar, o componente ReclassificadorOffline reenvia os lotes pendentes para a IA classificar automaticamente.</text>

  <!-- Legenda de tipos -->
  <text x="40" y="1054" class="sectionLbl">LEGENDA</text>
  <rect x="40" y="1066" width="16" height="16" rx="3" fill="#0e7490"/>
  <text x="64" y="1079" class="cardLine">Aplicativo (cliente)</text>
  <rect x="230" y="1066" width="16" height="16" rx="3" fill="#7c3aed"/>
  <text x="254" y="1079" class="cardLine">Machine Learning (Hugging Face)</text>
  <rect x="520" y="1066" width="16" height="16" rx="3" fill="#ea580c"/>
  <text x="544" y="1079" class="cardLine">Servicos de nuvem (Firebase / Cloudinary)</text>
  <rect x="860" y="1066" width="16" height="16" rx="3" fill="#16a34a"/>
  <text x="884" y="1079" class="cardLine">APIs externas e nativas</text>

  <text x="620" y="1130" text-anchor="middle" class="cardTag">Documentacao tecnica - Projeto Integrador (ADS) - App versao 1.0.0</text>
</svg>
